name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, types, boundaries, unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile-exact)
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Architectural & security boundaries
        run: npm run check:boundaries

      - name: Unit, integration and component tests with coverage
        run: npm run test:coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end, accessibility and performance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright (builds the app, starts the mock GitHub server)
        run: npm run test:e2e

      - name: Core Web Vitals measurement (production build)
        env:
          GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME || 'octocat' }}
          GITHUB_CACHE_TTL_SECONDS: '900'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3200
        run: |
          npm run build
          npx next start --port 3200 &
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:3200/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3200/ > /dev/null
          PORT=3200 npm run perf

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Fails the build on high/critical advisories in the production tree.
      - run: npm audit --audit-level=high
